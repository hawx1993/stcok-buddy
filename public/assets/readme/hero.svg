<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" fill="none">
  <title>StockBuddy — 对话式 A 股投研助手</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="60%" stop-color="#111820"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F0883E" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F0883E" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F0883E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="primary-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="#30363D" stroke-width="0.3" opacity="0.4">
    <line x1="64" y1="0" x2="64" y2="360"/>
    <line x1="1136" y1="0" x2="1136" y2="360"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
  </g>

  <!-- Horizontal accent rule -->
  <rect x="300" y="78" width="600" height="1" fill="url(#accent-line)" rx="0.5"/>

  <!-- Left: Title block -->
  <g transform="translate(64, 90)">
    <!-- Category label -->
    <text x="0" y="0" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="500" fill="#8B949E" letter-spacing="2">
      ELECTRON · REACT · AI
    </text>

    <!-- Project name -->
    <text x="0" y="52" font-family="system-ui,-apple-system,sans-serif" font-size="64" font-weight="700" fill="#E6EDF3" letter-spacing="-1">
      StockBuddy
    </text>

    <!-- Description -->
    <text x="0" y="92" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="400" fill="#8B949E">
      对话式 A 股投研助手 — 用自然语言完成股票研究、行情分析与报告生成
    </text>

    <!-- Feature tags -->
    <g transform="translate(0, 122)" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="500">
      <rect x="0" y="-16" width="78" height="26" rx="4" fill="#1C2128" stroke="#30363D" stroke-width="0.5"/>
      <text x="14" y="1" fill="#3FB950">▲ 实时行情</text>

      <rect x="90" y="-16" width="90" height="26" rx="4" fill="#1C2128" stroke="#30363D" stroke-width="0.5"/>
      <text x="104" y="1" fill="#58A6FF">◆ AI 投研</text>

      <rect x="192" y="-16" width="78" height="26" rx="4" fill="#1C2128" stroke="#30363D" stroke-width="0.5"/>
      <text x="206" y="1" fill="#F0883E">● 离线缓存</text>

      <rect x="282" y="-16" width="78" height="26" rx="4" fill="#1C2128" stroke="#30363D" stroke-width="0.5"/>
      <text x="296" y="1" fill="#A371F7">◈ 多 Agent</text>
    </g>
  </g>

  <!-- Right: Market data motif — mini candlestick panel -->
  <g transform="translate(760, 80)">
    <!-- Panel frame -->
    <rect x="0" y="0" width="376" height="210" rx="8" fill="#161B22" stroke="#30363D" stroke-width="0.5"/>

    <!-- Panel header -->
    <rect x="0" y="0" width="376" height="34" rx="8" fill="none"/>
    <rect x="0" y="16" width="376" height="18" fill="#1C2128"/>
    <text x="16" y="23" font-family="ui-monospace,SFMono-Regular,monospace" font-size="11" fill="#8B949E">行情面板 · 上海主板</text>
    <text x="360" y="23" font-family="ui-monospace,SFMono-Regular,monospace" font-size="11" fill="#3FB950" text-anchor="end">▼2.8%</text>

    <!-- Mini table header -->
    <g transform="translate(8, 40)" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#8B949E">
      <text x="0" y="0">代码</text>
      <text x="52" y="0">名称</text>
      <text x="130" y="0">最新价</text>
      <text x="190" y="0">涨跌幅</text>
      <text x="260" y="0">成交额</text>
    </g>

    <!-- Divider -->
    <line x1="8" y1="46" x2="368" y2="46" stroke="#21262D" stroke-width="0.5"/>

    <!-- Row 1 — green -->
    <g transform="translate(8, 56)" font-family="ui-monospace,SFMono-Regular,monospace" font-size="11">
      <text x="0" y="0" fill="#8B949E">600519</text>
      <text x="52" y="0" fill="#E6EDF3">贵州茅台</text>
      <text x="130" y="0" fill="#E6EDF3">1,850.00</text>
      <text x="190" y="0" fill="#3FB950">+2.15%</text>
      <text x="260" y="0" fill="#8B949E">42.8亿</text>
    </g>

    <!-- Row 2 — red -->
    <g transform="translate(8, 74)" font-family="ui-monospace,SFMono-Regular,monospace" font-size="11">
      <text x="0" y="0" fill="#8B949E">000858</text>
      <text x="52" y="0" fill="#E6EDF3">五 粮 液</text>
      <text x="130" y="0" fill="#E6EDF3">152.30</text>
      <text x="190" y="0" fill="#F85149">−0.83%</text>
      <text x="260" y="0" fill="#8B949E">18.2亿</text>
    </g>

    <!-- Row 3 — green -->
    <g transform="translate(8, 92)" font-family="ui-monospace,SFMono-Regular,monospace" font-size="11">
      <text x="0" y="0" fill="#8B949E">300750</text>
      <text x="52" y="0" fill="#E6EDF3">宁德时代</text>
      <text x="130" y="0" fill="#E6EDF3">218.50</text>
      <text x="190" y="0" fill="#3FB950">+3.42%</text>
      <text x="260" y="0" fill="#8B949E">35.6亿</text>
    </g>

    <!-- Row 4 — red -->
    <g transform="translate(8, 110)" font-family="ui-monospace,SFMono-Regular,monospace" font-size="11">
      <text x="0" y="0" fill="#8B949E">688981</text>
      <text x="52" y="0" fill="#E6EDF3">中芯国际</text>
      <text x="130" y="0" fill="#E6EDF3">48.65</text>
      <text x="190" y="0" fill="#F85149">−1.27%</text>
      <text x="260" y="0" fill="#8B949E">21.3亿</text>
    </g>

    <!-- Row 5 — green -->
    <g transform="translate(8, 128)" font-family="ui-monospace,SFMono-Regular,monospace" font-size="11">
      <text x="0" y="0" fill="#8B949E">002594</text>
      <text x="52" y="0" fill="#E6EDF3">比亚迪</text>
      <text x="130" y="0" fill="#E6EDF3">282.00</text>
      <text x="190" y="0" fill="#3FB950">+1.08%</text>
      <text x="260" y="0" fill="#8B949E">28.7亿</text>
    </g>

    <!-- Mini candlestick icons — 3 bars -->
    <g transform="translate(310, 56)" fill="none" stroke-width="1.2">
      <!-- Bull candle -->
      <line x1="8" y1="2" x2="8" y2="13" stroke="#3FB950"/>
      <rect x="2" y="3" width="12" height="8" rx="1" fill="#3FB950" stroke="none"/>

      <!-- Bear candle -->
      <line x1="30" y1="1" x2="30" y2="14" stroke="#F85149"/>
      <rect x="24" y="6" width="12" height="7" rx="1" fill="#F85149" stroke="none"/>

      <!-- Bull candle -->
      <line x1="52" y1="3" x2="52" y2="12" stroke="#3FB950"/>
      <rect x="46" y="2" width="12" height="9" rx="1" fill="#3FB950" stroke="none"/>
    </g>

    <!-- Data flow dots between left title and panel -->
    <g opacity="0.3">
      <circle cx="-100" cy="60" r="1.5" fill="#58A6FF"/>
      <circle cx="-80" cy="80" r="1" fill="#58A6FF"/>
      <circle cx="-90" cy="100" r="1.5" fill="#8B949E"/>
      <circle cx="-70" cy="120" r="1" fill="#F0883E"/>
    </g>
  </g>

  <!-- Bottom bar: metadata -->
  <g transform="translate(64, 308)" font-family="ui-monospace,SFMono-Regular,monospace" font-size="11" fill="#484F58">
    <text x="0" y="0">v0.5.8</text>
    <circle cx="50" cy="-4" r="1.5" fill="#30363D"/>
    <text x="58" y="0">macOS · Windows</text>
    <circle cx="172" cy="-4" r="1.5" fill="#30363D"/>
    <text x="180" y="0">Electron + React + DuckDB</text>
    <circle cx="340" cy="-4" r="1.5" fill="#30363D"/>
    <text x="348" y="0">stock-sdk 数据源</text>
    <circle cx="468" cy="-4" r="1.5" fill="#30363D"/>
    <text x="476" y="0">DeepSeek / OpenAI / Qwen / GLM / Kimi</text>
  </g>
</svg>
